  <!-- Cute Smile with cute bunny tooth -->
  <path d="M 140 172 Q 150 182 160 172" fill="none" stroke="#B83A4B" stroke-width="3" stroke-linecap="round"/>

  <!-- Jungkook Styled Hair -->
  <path d="M 85 140 C 80 85, 130 70, 150 70 C 170 70, 220 85, 215 140 C 200 115, 185 110, 150 110 C 115 110, 100 115, 85 140 Z" fill="url(#hairGrad)"/>
  <!-- Bangs -->
  <path d="M 98 120 C 115 138, 130 110, 145 135 C 155 115, 175 135, 195 120 C 185 105, 170 100, 150 100 C 130 100, 115 105, 98 120 Z" fill="url(#hairGrad)"/>

  <!-- Purple Heart & Sparkles -->
  <g transform="translate(210, 175)">
    <path d="M 0 5 C -10 -10, -25 5, 0 25 C 25 5, 10 -10, 0 5 Z" fill="#9C27B0"/>
  </g>
