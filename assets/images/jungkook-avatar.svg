<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5F5"/>
      <stop offset="50%" stop-color="#FFCCD5"/>
      <stop offset="100%" stop-color="#CBB4E8"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2EE"/>
      <stop offset="100%" stop-color="#FCE1D8"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D223B"/>
      <stop offset="100%" stop-color="#4B3264"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="150" cy="150" r="145" fill="url(#bgGrad)"/>
  
  <!-- Bunny Ears -->
  <path d="M 105 105 C 80 40, 95 10, 115 15 C 130 20, 130 65, 120 100 Z" fill="#FFF" stroke="#FFCCD5" stroke-width="3"/>
  <path d="M 107 90 C 95 45, 102 25, 115 28 C 122 32, 122 65, 115 88 Z" fill="#FFB6C1"/>

  <path d="M 195 105 C 220 40, 205 10, 185 15 C 170 20, 170 65, 180 100 Z" fill="#FFF" stroke="#FFCCD5" stroke-width="3"/>
